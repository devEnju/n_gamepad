name: n_gamepad
description: "Flutter plugin for listening to various game controller inputs."
repository: https://github.com/nx-gamepad/n_gamepad
issue_tracker: https://github.com/nx-gamepad/n_gamepad/issues
version: 0.0.7
homepage:

environment:
  sdk: '^3.12.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  jni: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  jnigen: ^0.16.0

flutter:
  plugin:
    platforms:
      android:
        package: com.marvinvogl.n_gamepad
        pluginClass: GamepadPlugin
        ffiPlugin: true
